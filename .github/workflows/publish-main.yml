name: Publish main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cedar-main-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release): publish CEDAR ')
    runs-on: ubuntu-24.04
    outputs:
      release_tag: v${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate the publication
        run: |
          python3 scripts/update_source_inventory.py --check
          python3 scripts/audit_public.py
          python3 -m unittest discover -s tests -p test_update_channels.py
          python3 -m unittest discover -s tests -p test_installer.py
          python3 -m unittest discover -s tests -p test_distribution.py
          python3 -m unittest discover -s tests -p test_packaging.py
          python3 -m unittest discover -s tests -p test_packaged_install.py
          python3 -m unittest discover -s tests -p test_publish_version.py
      - name: Advance the published version
        id: version
        run: |
          version=$(python3 scripts/publish_version.py)
          echo "number=$version" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/build_packages.py check
          git add VERSION packaging/arch/PKGBUILD packaging/nix/package.nix packaging/fedora/cedar-shell.spec
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish CEDAR $version"
          fi
          if ! git rev-parse "v$version" >/dev/null 2>&1; then
            git tag "v$version"
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "v$version^{commit}")"
      - name: Build and verify release assets
        run: |
          python3 scripts/package_release.py --release-assets dist
          python3 tests/check_artifact.py dist/cedar-*-x86_64.tar.gz
      - name: Publish version and tag
        env:
          CEDAR_VERSION: ${{ steps.version.outputs.number }}
        run: |
          # A concurrent human push is never overwritten. Retry via workflow_dispatch.
          git push --atomic origin HEAD:main "refs/tags/v$CEDAR_VERSION"
  release:
    needs: publish
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
    secrets: inherit
