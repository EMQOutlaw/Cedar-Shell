name: Publish main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cedar-main-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release): publish CEDAR ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate the publication
        run: |
          python3 scripts/update_source_inventory.py --check
          python3 scripts/audit_public.py
          python3 -m unittest discover -s tests -p test_update_channels.py
          python3 -m unittest discover -s tests -p test_installer.py
          python3 -m unittest discover -s tests -p test_distribution.py
      - name: Advance the published version
        id: version
        run: |
          version=$(python3 scripts/publish_version.py)
          echo "number=$version" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION packaging/arch/PKGBUILD packaging/nix/package.nix
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish CEDAR $version"
          fi
          if ! git rev-parse "v$version" >/dev/null 2>&1; then
            git tag "v$version"
          fi
      - name: Build and verify release assets
        run: |
          python3 scripts/package_release.py --release-assets dist
          python3 tests/check_artifact.py dist/cedar-*-x86_64.tar.gz
      - name: Publish version and tag
        env:
          CEDAR_VERSION: ${{ steps.version.outputs.number }}
        run: |
          # A concurrent human push is never overwritten. Retry via workflow_dispatch.
          git push --atomic origin HEAD:main "refs/tags/v$CEDAR_VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CEDAR_VERSION: ${{ steps.version.outputs.number }}
        run: |
          if ! gh release view "v$CEDAR_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$CEDAR_VERSION" --repo "$GITHUB_REPOSITORY" --title "CEDAR $CEDAR_VERSION" --generate-notes
          fi
          gh release upload "v$CEDAR_VERSION" dist/cedar-*-x86_64.tar.gz dist/cedar-*-x86_64.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
