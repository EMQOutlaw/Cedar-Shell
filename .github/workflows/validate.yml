name: Development candidate validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native Task Manager build and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Native collectors, process safety, IPC and standalone window
        run: |
          CEDAR_TASK_REQUIRE_IPC=1 python3 tests/check_task_manager.py
          python3 -m unittest discover -s tests -p test_task_manager.py
      - name: Stdlib recovery, privacy and archive failure tests
        run: |
          python3 -m unittest discover -s tests -p test_distribution.py
          python3 -m unittest discover -s tests -p test_omarchy_session.py
          python3 -m unittest discover -s tests -p test_omacale_providers.py
          python3 -m unittest discover -s tests -p test_portability.py
          python3 -m unittest discover -s tests -p test_portable_lifecycle.py
          python3 -m unittest discover -s tests -p test_master_changes.py
          python3 -m unittest discover -s tests -p test_update_checkout.py
          python3 -m unittest discover -s tests -p test_update_channels.py
          python3 -m unittest discover -s tests -p test_installer.py
          python3 -m unittest discover -s tests -p test_keybinds.py
          python3 -m unittest discover -s tests -p test_theming.py
          python3 -m unittest discover -s tests -p test_compatibility.py
          python3 -m unittest discover -s tests -p test_calendar.py
          python3 -m unittest discover -s tests -p test_validation_checks.py
      - name: Security boundaries and resource-accounting regressions
        run: |
          python3 -m unittest discover -s tests -p test_bootstrap_security.py
          python3 -m unittest discover -s tests -p test_installer_stream.py
          python3 -m unittest discover -s tests -p test_distribution_memory.py
          python3 -m unittest discover -s tests -p test_measure_resources.py
          python3 -m unittest discover -s tests -p test_task_manager_profiling.py
          python3 -m unittest discover -s tests -p 'test_shield*.py'
          python3 -m unittest discover -s tests -p 'test_lock_bridge*.py'
      - name: Python syntax and shell bootstrap
        run: |
          python3 -m compileall -q scripts installer compatibility
          bash -n install.sh
          bash -n installer/bootstrap/install.sh
          python3 scripts/audit_public.py
          python3 scripts/update_source_inventory.py --check
      - name: Settings schema and helper unit tests
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_settings*.py'
      - name: Bar geometry and interruptible transitions
        run: |
          node tests/core/strata_test.js
          node tests/core/core_placement_test.js
          node tests/core/canopy_transition_test.js
          node --test tests/notes/*.test.js
      - name: Build and test exact candidate contents
        run: |
          python3 scripts/package_release.py /tmp/cedar-shell-development.tar.gz
          python3 tests/check_artifact.py /tmp/cedar-shell-development.tar.gz
      - name: Record untested gates
        run: |
          echo 'Settings Quickshell harnesses run offscreen in a separate job. Live Hyprland, PAM, GPU and full desktop handoff still require controlled runners; these jobs do not certify them.' >> "$GITHUB_STEP_SUMMARY"
  settings-offscreen:
    needs: source-and-recovery
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Provide Quickshell on the disposable offscreen runner
        run: pacman -Syu --noconfirm --needed git python python-gobject quickshell qt6-5compat ttf-dejavu
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Settings service, Dictation and actual floating window harnesses
        run: |
          python3 tests/check_settings_service.py
          python3 tests/check_settings_window.py
          python3 tests/check_settings_responsive.py
          python3 tests/check_station_tasks.py
          python3 tests/check_theme_palettes.py
          python3 tests/check_service_lifecycle.py
          python3 tests/check_understory.py
          python3 tests/check_surface_policy.py
          python3 tests/check_canopy.py
          python3 tests/check_core_host.py
          python3 tests/check_core_persistence.py
          python3 tests/check_navigation.py
          python3 tests/check_lock_auth.py
          python3 tests/check_lock_wiring.py
          python3 -m unittest discover -s tests -p test_default_apps.py
# No release publishing, secrets, elevated pull_request_target workflow, or user auto-update.
