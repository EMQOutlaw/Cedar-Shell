# Hyprland 0.54 hyprlang reference ONLY. Current systems use hyprland.lua.
# Source this only from a selected-theme file, never unconditionally.
general {
    border_size = 1
    col.active_border = rgb(9DFFB0) rgb(3FE0C5) 45deg
    col.inactive_border = rgb(315C4D)
}
decoration {
    rounding = 3
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}
layerrule {
    name = cedar-blur
    match:namespace = ^cedar-.*$
    blur = on
    ignore_alpha = 0.1
}
# This guarded exec-once delegates to the theme selector and launches qs -c cedar.
exec-once = python3 "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/cedar/scripts/theme-sync.py"
unbind = SUPER ALT, F
bind = SUPER ALT, F, exec, qs -c cedar ipc call hud toggle
unbind = SUPER, SPACE
bind = SUPER, SPACE, exec, qs -c cedar ipc call launcher toggle
unbind = SUPER, ESCAPE
bind = SUPER, ESCAPE, exec, qs -c cedar ipc call power toggle
unbind = SUPER ALT, L
bind = SUPER ALT, L, exec, qs -c cedar ipc call lock lock
unbind = SUPER SHIFT CTRL, SPACE
bind = SUPER SHIFT CTRL, SPACE, exec, qs -c cedar ipc call themes toggle
unbind = SUPER CTRL, SPACE
bind = SUPER CTRL, SPACE, exec, qs -c cedar ipc call wallpapers toggle
unbind = SUPER CTRL, L
bind = SUPER CTRL, L, exec, qs -c cedar ipc call lock lock
unbind = SUPER SHIFT ALT, comma
bind = SUPER SHIFT ALT, comma, exec, qs -c cedar ipc call notifications toggle
unbind = , XF86AudioRaiseVolume
bind = , XF86AudioRaiseVolume, exec, qs -c cedar ipc call osd volume 5
unbind = , XF86AudioLowerVolume
bind = , XF86AudioLowerVolume, exec, qs -c cedar ipc call osd volume -5
unbind = , XF86AudioMute
bind = , XF86AudioMute, exec, qs -c cedar ipc call osd mute
unbind = , XF86MonBrightnessUp
bind = , XF86MonBrightnessUp, exec, qs -c cedar ipc call osd brightness 5
unbind = , XF86MonBrightnessDown
bind = , XF86MonBrightnessDown, exec, qs -c cedar ipc call osd brightness -5
