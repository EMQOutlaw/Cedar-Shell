# CEDAR palette for Hyprland using hyprlang configuration.
# Optional: source from your own configuration. No startup or key changes.
general {
    border_size = 1
    col.active_border = rgb(9DFFB0) rgb(3FE0C5) 45deg
    col.inactive_border = rgb(315C4D)
}
decoration {
    rounding = 3
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}
