# CEDAR keybinds for Hyprland's hyprlang configuration.
#
# Generated from data/keybinds.json by scripts/keybinds.py; edit the
# definition and run `python3 scripts/keybinds.py --write`. The installer
# copies this file to ~/.config/cedar/hypr/keybinds.conf and CEDAR's
# generated.conf sources it. Every bind first unbinds the same keys, so it
# wins over an earlier binding on that combination and leaves every other
# binding alone. Personal changes go in user.conf (sourced last) or
# Settings > Keybinds. Shell actions go to the CEDAR release through its IPC;
# the app bindings open the terminal, browser and file manager chosen in
# CEDAR Settings.

# `cedar ipc` addresses the shell that owns the `cedar` Quickshell profile
# (release or checkout) and falls back to the release path.
$cedarShell = ~/.local/bin/cedar ipc
$cedarRuntime = python3 ~/.local/share/cedar/current/scripts/desktop_runtime.py
$cedarLaunch = $cedarRuntime launch

# Applications
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Toggle the application launcher, exec, $cedarShell menu toggle apps
unbind = SUPER, T
bindd = SUPER, T, Open the terminal chosen in Settings, exec, $cedarLaunch terminal
unbind = SUPER, W
bindd = SUPER, W, Open the browser chosen in Settings, exec, $cedarLaunch browser
unbind = SUPER, E
bindd = SUPER, E, Open the file manager chosen in Settings, exec, $cedarLaunch files
unbind = SUPER, C
bindd = SUPER, C, Unified copy (Ctrl+C  or Ctrl+Shift+C in a terminal), exec, $cedarRuntime clipboard copy
unbind = SUPER, X
bindd = SUPER, X, Unified cut where the window supports it (Ctrl+X; nothing in a terminal), exec, $cedarRuntime clipboard cut
unbind = SUPER, V
bindd = SUPER, V, Unified paste (Ctrl+V  or Ctrl+Shift+V in a terminal), exec, $cedarRuntime clipboard paste
unbind = SUPER SHIFT, V
bindd = SUPER SHIFT, V, Toggle clipboard history, exec, $cedarShell canopy flip clipboard
unbind = SUPER SHIFT, K
bindd = SUPER SHIFT, K, Show the searchable active keymap, exec, $cedarShell keymap show
unbind = SUPER CTRL ALT, SPACE
bindd = SUPER CTRL ALT, SPACE, Choose a wallpaper from the rounded preview grid, exec, $cedarShell wallpapers toggle
unbind = SUPER ALT, N
bindd = SUPER ALT, N, Toggle Field Notes  the floating sheet for sketches and typed notes, exec, $cedarShell notes toggle

# Dictation
unbind = SUPER CTRL, X
bindd = SUPER CTRL, X, Toggle dictation: Voxtype listens  then types what you said, exec, $cedarShell dictation toggle
unbind = , F9
bindd = , F9, Hold to talk; release to stop and let Voxtype type, exec, $cedarShell dictation start
bindrd = , F9, Hold to talk; release to stop and let Voxtype type, exec, $cedarShell dictation stop

# Windows
unbind = SUPER, Q
bindd = SUPER, Q, Close the focused window, killactive
unbind = SUPER, F
bindd = SUPER, F, Toggle fullscreen for the focused window, fullscreen, 0
unbind = SUPER ALT, SPACE
bindd = SUPER ALT, SPACE, Toggle the focused window between floating and tiled, togglefloating
unbind = SUPER, left
bindd = SUPER, left, Focus the window to the left, movefocus, l
unbind = SUPER, right
bindd = SUPER, right, Focus the window to the right, movefocus, r
unbind = SUPER, up
bindd = SUPER, up, Focus the window to the top, movefocus, u
unbind = SUPER, down
bindd = SUPER, down, Focus the window to the bottom, movefocus, d
unbind = SUPER SHIFT, left
bindd = SUPER SHIFT, left, Move the focused window left, movewindow, l
unbind = SUPER SHIFT, right
bindd = SUPER SHIFT, right, Move the focused window right, movewindow, r
unbind = SUPER SHIFT, up
bindd = SUPER SHIFT, up, Move the focused window up, movewindow, u
unbind = SUPER SHIFT, down
bindd = SUPER SHIFT, down, Move the focused window down, movewindow, d
unbind = SUPER, mouse:272
bindm = SUPER, mouse:272, movewindow
unbind = SUPER, mouse:273
bindm = SUPER, mouse:273, resizewindow

# Workspaces
unbind = SUPER, 1
bindd = SUPER, 1, Switch to workspace 1, workspace, 1
unbind = SUPER, 2
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
unbind = SUPER, 3
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
unbind = SUPER, 4
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
unbind = SUPER, 5
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
unbind = SUPER, 6
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
unbind = SUPER, 7
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
unbind = SUPER, 8
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
unbind = SUPER, 9
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
unbind = SUPER, 0
bindd = SUPER, 0, Switch to workspace 10, workspace, 10
unbind = SUPER SHIFT, 1
bindd = SUPER SHIFT, 1, Send the focused window to workspace 1 and follow it, movetoworkspace, 1
unbind = SUPER SHIFT, 2
bindd = SUPER SHIFT, 2, Send the focused window to workspace 2 and follow it, movetoworkspace, 2
unbind = SUPER SHIFT, 3
bindd = SUPER SHIFT, 3, Send the focused window to workspace 3 and follow it, movetoworkspace, 3
unbind = SUPER SHIFT, 4
bindd = SUPER SHIFT, 4, Send the focused window to workspace 4 and follow it, movetoworkspace, 4
unbind = SUPER SHIFT, 5
bindd = SUPER SHIFT, 5, Send the focused window to workspace 5 and follow it, movetoworkspace, 5
unbind = SUPER SHIFT, 6
bindd = SUPER SHIFT, 6, Send the focused window to workspace 6 and follow it, movetoworkspace, 6
unbind = SUPER SHIFT, 7
bindd = SUPER SHIFT, 7, Send the focused window to workspace 7 and follow it, movetoworkspace, 7
unbind = SUPER SHIFT, 8
bindd = SUPER SHIFT, 8, Send the focused window to workspace 8 and follow it, movetoworkspace, 8
unbind = SUPER SHIFT, 9
bindd = SUPER SHIFT, 9, Send the focused window to workspace 9 and follow it, movetoworkspace, 9
unbind = SUPER SHIFT, 0
bindd = SUPER SHIFT, 0, Send the focused window to workspace 10 and follow it, movetoworkspace, 10

# Scratchpad
unbind = SUPER, S
bindd = SUPER, S, Show or hide the scratchpad, togglespecialworkspace, special
unbind = SUPER ALT, S
bindd = SUPER ALT, S, Send the focused window to the scratchpad and stay on this workspace, movetoworkspacesilent, special:special

# Capture
unbind = SUPER, P
bindd = SUPER, P, Open the screenshot menu, exec, $cedarShell menu toggle capture
unbind = , Print
bindld = , Print, Open the screenshot menu (Print Screen key), exec, $cedarShell menu toggle capture

# Session
unbind = SUPER, L
bindd = SUPER, L, Lock the session with Trailwatch, exec, $cedarShell lock lock
unbind = SUPER, Escape
bindd = SUPER, Escape, Toggle the power and session menu, exec, $cedarShell power toggle
unbind = SUPER, Comma
bindd = SUPER, Comma, Toggle CEDAR Settings, exec, $cedarShell settings toggle
unbind = SUPER, K
bindd = SUPER, K, Toggle this keybind reference, exec, $cedarShell canopy flip keybinds

# Media and hardware
unbind = , XF86AudioPlay
bindld = , XF86AudioPlay, Play or pause, exec, $cedarShell media toggle
unbind = , XF86AudioPause
bindld = , XF86AudioPause, Play or pause, exec, $cedarShell media toggle
unbind = CTRL SUPER, SPACE
bindld = CTRL SUPER, SPACE, Play or pause, exec, $cedarShell media toggle
unbind = , XF86AudioNext
bindld = , XF86AudioNext, Next track, exec, $cedarShell media next
unbind = CTRL SUPER, Equal
bindld = CTRL SUPER, Equal, Next track, exec, $cedarShell media next
unbind = , XF86AudioPrev
bindld = , XF86AudioPrev, Previous track, exec, $cedarShell media previous
unbind = CTRL SUPER, Minus
bindld = CTRL SUPER, Minus, Previous track, exec, $cedarShell media previous
unbind = , XF86AudioStop
bindld = , XF86AudioStop, Stop playback, exec, $cedarShell media pause
unbind = CTRL SUPER, Backspace
bindld = CTRL SUPER, Backspace, Stop playback, exec, $cedarShell media pause
unbind = , XF86AudioMute
bindld = , XF86AudioMute, Mute or unmute the output, exec, $cedarShell osd mute
unbind = SUPER SHIFT, M
bindld = SUPER SHIFT, M, Mute or unmute the output, exec, $cedarShell osd mute
unbind = , XF86AudioMicMute
bindld = , XF86AudioMicMute, Mute or unmute the microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
unbind = , XF86AudioRaiseVolume
bindled = , XF86AudioRaiseVolume, Volume up, exec, $cedarShell osd volume 5
unbind = , XF86AudioLowerVolume
bindled = , XF86AudioLowerVolume, Volume down, exec, $cedarShell osd volume -5
unbind = , XF86MonBrightnessUp
bindled = , XF86MonBrightnessUp, Brightness up, exec, $cedarShell osd brightness 5
unbind = , XF86MonBrightnessDown
bindled = , XF86MonBrightnessDown, Brightness down, exec, $cedarShell osd brightness -5
