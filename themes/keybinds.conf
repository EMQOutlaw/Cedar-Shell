# CEDAR keybinds, Caelestia layout, for Hyprland's hyprlang configuration.
#
# The installer copies this file to ~/.config/cedar/hypr/keybinds.conf and
# CEDAR's generated.conf sources it; that copy is yours to edit. Every bind
# first unbinds the same keys, so it wins over an earlier binding on the
# same combination and leaves every other binding alone. Shell actions go
# to the installed CEDAR release through its IPC; the app bindings open the
# terminal, browser, editor and file manager chosen in CEDAR Settings.

# `cedar ipc` addresses the shell that owns the `cedar` Quickshell profile
# (release or checkout) and falls back to the release path.
$cedarShell = ~/.local/bin/cedar ipc
$cedarLaunch = python3 ~/.local/share/cedar/current/scripts/desktop_runtime.py launch
$cedar = ~/.local/bin/cedar

# CEDAR
unbind = SUPER, SUPER_L
bindrd = SUPER, SUPER_L, CEDAR applications, exec, $cedarShell menu toggle apps
unbind = SUPER, SPACE
bindd = SUPER, SPACE, CEDAR applications, exec, $cedarShell menu toggle apps
unbind = SUPER SHIFT, SPACE
bindd = SUPER SHIFT, SPACE, CEDAR Go menu, exec, $cedarShell menu toggle root
unbind = SUPER, N
bindd = SUPER, N, Quick Controls, exec, $cedarShell control toggle
unbind = SUPER, K
bindd = SUPER, K, Field Station, exec, $cedarShell hud toggle
unbind = SUPER SHIFT, N
bindd = SUPER SHIFT, N, Notifications, exec, $cedarShell notifications toggle
unbind = CTRL ALT, C
bindld = CTRL ALT, C, Clear notifications, exec, $cedarShell notifications dismissAll
unbind = CTRL ALT, Delete
bindd = CTRL ALT, Delete, Power, exec, $cedarShell power toggle
unbind = SUPER, L
bindd = SUPER, L, Lock, exec, $cedarShell lock lock
unbind = SUPER ALT, L
bindd = SUPER ALT, L, Lock (session locker), exec, $cedar lock
unbind = SUPER SHIFT, L
bindld = SUPER SHIFT, L, Lock and suspend, exec, $cedar lock --suspend
unbind = SUPER ALT, P
bindd = SUPER ALT, P, CEDAR Settings, exec, $cedarShell settings toggle
unbind = SUPER, G
bindd = SUPER, G, Gaming Mode, exec, $cedarShell gaming toggle
bindd = SUPER SHIFT, P, Desktop Profiles, exec, $cedarShell profiles open
bindd = SUPER SHIFT, F, Focus, exec, $cedarShell focus open
bindd = SUPER SHIFT, H, Station (health), exec, $cedarShell station open
bindd = SUPER, TAB, Workspace overview, exec, $cedarShell canopy flip workspaces
unbind = SUPER, V
bindd = SUPER, V, Clipboard, exec, $cedarShell canopy open clipboard
unbind = SUPER ALT, V
bindd = SUPER ALT, V, Clipboard, exec, $cedarShell canopy open clipboard
unbind = CTRL ALT, V
bindd = CTRL ALT, V, Audio, exec, $cedarShell canopy open audio

# Applications
unbind = SUPER, T
bindd = SUPER, T, Terminal, exec, $cedarLaunch terminal
unbind = SUPER, W
bindd = SUPER, W, Browser, exec, $cedarLaunch browser
unbind = SUPER, C
bindd = SUPER, C, Editor, exec, $cedarLaunch editor
unbind = SUPER, E
bindd = SUPER, E, Files, exec, $cedarLaunch files

# Capture
unbind = , Print
bindld = , Print, Capture, exec, $cedarShell menu toggle capture
unbind = SUPER SHIFT, S
bindd = SUPER SHIFT, S, Capture, exec, $cedarShell menu toggle capture
unbind = SUPER SHIFT ALT, S
bindd = SUPER SHIFT ALT, S, Capture, exec, $cedarShell menu toggle capture
unbind = CTRL ALT, R
bindd = CTRL ALT, R, Record, exec, $cedarShell menu toggle capture
unbind = SUPER ALT, R
bindd = SUPER ALT, R, Record, exec, $cedarShell menu toggle capture
unbind = SUPER SHIFT ALT, R
bindd = SUPER SHIFT ALT, R, Record, exec, $cedarShell menu toggle capture
unbind = SUPER SHIFT, C
bindd = SUPER SHIFT, C, Color picker, exec, hyprpicker -a

